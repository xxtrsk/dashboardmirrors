name: Auto Update CRM Data & Regenerate Dashboard

on:
  schedule:
    # Runs every 8 hours (00:00, 08:00, 16:00 UTC)
    - cron: '0 */8 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Fetch CRM Stats & Update Data
        env:
          CRM_API_KEY: ${{ secrets.CRM_API_KEY }}
          CRM_API_URL: ${{ secrets.CRM_API_URL }}
        run: |
          python update_crm_data.py
          python generate_excel.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add data.js "Dashboard + KPI (Обновленный).xlsx" chatter_analytics_system.xls
          git diff-index --quiet HEAD || git commit -m "Auto-update CRM stats [skip ci]"
          git push
