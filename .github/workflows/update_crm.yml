name: Auto Update CRM Data & Regenerate Dashboard

on:
  schedule:
    # Runs every 8 hours (00:00, 08:00, 16:00 UTC)
    - cron: '0 */8 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Fetch CRM Stats & Update Data
        env:
          CRM_API_KEYS: ${{ secrets.CRM_API_KEYS }}
          CRM_API_KEY: ${{ secrets.CRM_API_KEY }}
          CRM_API_URL: ${{ secrets.CRM_API_URL }}
          CRM_API_KEY_47892: ${{ secrets.CRM_API_KEY_47892 }}
          CRM_API_KEY_39856: ${{ secrets.CRM_API_KEY_39856 }}
          CRM_API_KEY_30201: ${{ secrets.CRM_API_KEY_30201 }}
          CRM_API_KEY_4967: ${{ secrets.CRM_API_KEY_4967 }}
        run: |
          python update_crm_data.py
          python generate_excel.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js "Dashboard + KPI (Обновленный).xlsx" chatter_analytics_system.xls || true
          if git diff-index --quiet HEAD; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update CRM stats [skip ci]"
            git push
          fi
